<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quitanda MVC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Controle de Quitanda</h1>

        <!-- CADASTRO -->
        <div class="card">
            <h3>Cadastrar Produto</h3>

            <input type="text" id="nomeInput" placeholder="Nome do produto">
            <input type="text" id="categoriaInput" placeholder="Categoria">
            <input type="number" id="precoInput" placeholder="Preço">
            <input type="number" id="quantidadeInput" placeholder="Quantidade">

            <button id="addProdutoBtn">Adicionar</button>
        </div>

        <!-- VENDA -->
        <div class="card">
            <h3>Venda</h3>

            <input type="number" id="idVendaInput" placeholder="ID do produto">
            <input type="number" id="quantidadeVendaInput" placeholder="Quantidade">

            <button id="venderProdutoBtn">Vender</button>
        </div>

        <!-- MENSAGEM -->
        <p id="mensagem"></p>

        <!-- LISTA DE PRODUTOS -->
        <div class="card">
            <h3>Produtos</h3>
            <ul id="listaProdutos"></ul>
        </div>

        <!-- HISTÓRICO -->
        <div class="card">
            <h3>Histórico</h3>
            <ul id="listaMovimentacoes"></ul>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
